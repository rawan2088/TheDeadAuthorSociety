<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Details</title>
    <link rel="stylesheet" href="../CSS/main.css" />
    <link rel="stylesheet" href="../CSS/pages/book.css" />
  </head>
  <body>
    <div id="navbar"></div>

    <main>
      <!-- ── Book details ── -->
      <section class="book-details" aria-label="Book details">
        <img id="bookImg" src="" alt="" />

        <div class="book-info">
          <h1 id="bookTitle"></h1>

          <dl class="book-meta">
            <dt>Author</dt>
            <dd id="bookAuthor"></dd>

            <dt>Published</dt>
            <dd id="bookPublishedDate"></dd>

            <dt>Category</dt>
            <dd id="bookCategory"></dd>

            <dt>Status</dt>
            <dd><span id="bookStatus"></span></dd>

            <dt>Description</dt>
            <dd id="bookDescription"></dd>
          </dl>

          <button id="borrowBtn" type="button">Borrow</button>
        </div>
      </section>

      <!-- ── Comments ── -->
      <section id="commentsSection" aria-label="Comments">
        <h2>Comments</h2>

        <form id="commentForm" novalidate>
          <label for="commentRating">Rating</label>
          <select id="commentRating" name="rating">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
          </select>

          <label for="commentContent">Comment</label>
          <textarea
            id="commentContent"
            name="content"
            placeholder="Write your comment…"
          ></textarea>

          <button id="submitCommentBtn" type="button">Submit Comment</button>
          <p id="commentMsg" role="status" aria-live="polite"></p>
        </form>

        <div id="commentsList"></div>
      </section>
    </main>

    <footer>
      <a href="About.html">About Us</a> |
      <a href="Contact.html">Contact Us</a>
      <p>&copy; Library Management System. All rights reserved.</p>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/BookDetails.js"></script>
  </body>
</html>
