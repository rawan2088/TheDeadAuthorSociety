<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup - Online Library</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages/Sign_Up.css" />
  </head>
  <body>
    <div id="navbar"></div>

    <main>
      <div class="leftText">
        <h1>Create Account</h1>
        <h2>join The Dead Author Society</h2>
        <p>
          Discover timeless books, build your collection, and read in elegance.
        </p>
      </div>

      <div class="rightForm">
        <h2>Sign Up</h2>

        <p id="signupError"></p>

        <form id="signupForm">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="first-name" required />

          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="last-name" required />

          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />

          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />

          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            required
          />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <div class="roleOptions">
            <label for="role-user">
              <input
                type="radio"
                id="role-user"
                name="role"
                value="user"
                checked
              />
              User
            </label>

            <label for="role-admin">
              <input type="radio" id="role-admin" name="role" value="admin" />
              Admin
            </label>
          </div>

          <button type="submit">Create Account</button>
        </form>

        <p>Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </main>

    <footer>
      <a href="About.html">About Us</a> |
      <a href="Contact.html">Contact Us</a>
      <p>&copy; Library Management System. All rights reserved.</p>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/Signup.js"></script>
  </body>
</html>
